<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiempo</title>
    <link rel="stylesheet" href="tiempo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="button-container">
        <a href="vista.html" class="button">Inicio</a>
        <a href="tiempo.html" class="button">Tiempo</a>
        <a href="registros.html" class="button">Registros</a>
    </div>
    <div class="contenedor">
        <div class="dashboard">
            <h2>..::Dispensador::..</h2>
            <div class="images-container">
                <div class="image-wrapper">
                    
                    <img src="../imagen/agua.png" alt="Water Image">
                    <div class="message">El dispensador se abrió</div>
                    <input type="range" name="" id="myRange1"> 
                </div>
                <div class="image-wrapper">
                    <img src="../imagen/comida.png" alt="Food Image">
                    <h6>El dispensador se abrio</h6>
                    <input type="range" name="" id="myRange2"> 
                </div>
            </div>
            <div class="checkbox-container">
                <div class="form-check form-switch">
                    <select class="form-select" aria-label="Dispensar agua">
                        <option selected>Tiempo agua</option>
                        <option value="1">Minutos</option>
                        <option value="0">Segundos</option>
                    </select>
                </div>
                <div class="form-check form-switch">
                    <select class="form-select" aria-label="Dispensar comida">
                        <option selected>Tiempo comida</option>
                        <option value="1">Minutos</option>
                        <option value="0">Segundos</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
