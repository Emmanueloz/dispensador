<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="vista.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <article class="dashboard">
      <h2>..::Dispensador::..</h2>
      <article class="images-container">
        <div class="image-wrapper">
          <p id="DispensadorAgua"></p>
          <img src="../imagen/agua.png" alt="Water Image" />
          <p id="ContenedorAgua"></p>
          <p id="RecienteAgua"></p>
        </div>
        <div style="width: 20px"></div>
        <div class="image-wrapper">
          <p id="DispensadorComida"></p>
          <img src="../imagen/comida.png" alt="Food Image" />
          <p id="ContenedorComida"> </p>
          <p id="RecienteComida"></p>
        </div>
      </article>
      <aside class="checkbox-container">
        <div class="form-check form-switch">
          <input
          class="form-check-input"
          type="checkbox"
          role="switch"
          id="dispensarAgua"
          onchange="actualizarEstado('dispensarAgua', this.checked)"
        />
        
          <label class="form-check-label" for="flexSwitchCheckDefault"
            >Dispensar agua</label
          >
        </div>
        <div class="form-check form-switch">
          <input
          class="form-check-input"
          type="checkbox"
          role="switch"
          id="dispensarComida"
          onchange="actualizarEstado('dispensarComida', this.checked)"
        />
          <label class="form-check-label" for="flexSwitchCheckDefault"
            >Dispensar comida</label
          >
        </div>
      </aside>
    </article>

    <article class="dashboard">
      <h2>..::Dispensador::..</h2>
      <article class="images-container">
        <div class="image-wrapper">
          <p id="Tiempo1"></p>
          <img src="../imagen/agua.png" alt="Water Image" />
          <p id="Resultado1"></p>
          <input type="range" id="tiempoAgua" min="1" max="60" onchange="updateRangeValue(this, 'rangeValue1')" />
          <p>Valor seleccionado para Agua: <span id="rangeValue1"></span></p>       
         </div>
        <div class="image-wrapper">
          <p id="Tiempo2"></p>
          <img src="../imagen/comida.png" alt="Food Image" />
          <p id="Resultado2"></p>
          <input type="range" id="tiempoComida" min="0" max="60" value="30" onchange="updateRangeValue(this, 'rangeValue2')" />
          <p>Valor seleccionado para Comida: <span id="rangeValue2"></span></p>
        </div>
      </article>
      <aside class="checkbox-container">
        <div class="form-check form-switch">
          <select class="form-select" aria-label="Dispensar agua" id="tipoTiempoAgua">
            <option selected>Tiempo agua</option>
            <option value="m">Minuto</option>
            <option value="s">Segundo</option>
          </select>
          <br>
          <button id="InAgua" style="background-color: blue; color: white; padding: 10px;" onclick="actualizarTiempo('tiempo1')">Dispensar agua</button>

        </div>
        <div class="form-check form-switch">
          <select class="form-select" aria-label="Dispensar comida"   id="tipoTiempoComida">
            <option selected>Tiempo comida</option>
            <option value="m">Minuto</option>
            <option value="s">Segundo</option>
          </select>
          <br>
          <button id="InComida" style="background-color: blue; color: white; padding: 10px;" onclick="actualizarTiempo('tiempo2')">Dispensar comida</button>

        </div>
      </aside>  
    </article>

    <footer class="container">
      <div class="container">
        <div class="filter-section">
          <select id="filter-category">
            <option value="all">Todos</option>
            <option value="comida">Comida</option>
            <option value="agua">Agua</option>
          </select>
          <select id="filter-status">
            <option value="all">Todos</option>
            <option value="abierto">Abierto</option>
            <option value="cerrado">Cerrado</option>
          </select>
          <button id="filter-button">Filtrar</button>
        </div>
    
        <table class="container-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Identificador</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tablaRegistros">
            <!-- Aquí se agregarán dinámicamente las filas de la tabla -->
          </tbody>
        </table>
      </div>
    </footer>
    
  </body>
  <script src="https://www.gstatic.com/firebasejs/6.2.0/firebase-app.js"></script>
  <script  src="https://www.gstatic.com/firebasejs/3.1.0/firebase-database.js"></script>
  <script  src="./conexion.js"></script>

</html>
