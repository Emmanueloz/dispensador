<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="vista.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
        <article class="dashboard">
            <h2>..::Dispensador::..</h2>
            <article class="images-container">
                <div class="image-wrapper">
                    <header>Cerrado</header>
                    <img src="../imagen/agua.png" alt="Water Image">
                    <footer>El contenedor está lleno</footer>
                </div>
                <div style="width: 20px;"></div>
                <div class="image-wrapper">
                    <header>Cerrado</header>
                    <img src="../imagen/comida.png" alt="Food Image">
                    <footer>El contenedor está lleno</footer>
                </div>
            </article>
            <aside class="checkbox-container">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox"  role="switch" id="flexSwitchCheckDefault">
                    <label class="form-check-label" for="flexSwitchCheckDefault">Dispensar agua</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox"  role="switch" id="flexSwitchCheckDefault">
                    <label class="form-check-label" for="flexSwitchCheckDefault">Dispensar comida</label>
                </div>
            </aside>
        </article>

        <article class="dashboard">
            <h2>..::Dispensador::..</h2>
            <article class="images-container">
                <div class="image-wrapper">
                    <img src="../imagen/agua.png" alt="Water Image">
                    <div class="message">El dispensador se abrió</div>
                    <input type="range" name="" id="myRange1"> 
                </div>
                <div class="image-wrapper">
                    <img src="../imagen/comida.png" alt="Food Image">
                    <h6>El dispensador se abrio</h6>
                    <input type="range" name="" id="myRange2"> 
                </div>
            </article>
            <aside class="checkbox-container">
                <div class="form-check form-switch">
                    <select class="form-select" aria-label="Dispensar agua">
                        <option selected>Tiempo agua</option>
                        <option value="1">Minutos</option>
                        <option value="0">Segundos</option>
                    </select>
                </div>
                <div class="form-check form-switch">
                    <select class="form-select" aria-label="Dispensar comida">
                        <option selected>Tiempo comida</option>
                        <option value="1">Minutos</option>
                        <option value="0">Segundos</option>
                    </select>
                </div>
            </aside>
        </article>

    <footer class="container">
        <div class="clearfix">
            <table class="container-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Identificador</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Agua</td>
                        <td>1</td>
                        <td>Abierto</td>
                        <td>2024-04-16</td>
                        <td>10:00:00</td>
                    </tr>
                    <tr>
                        <td>Alimento</td>
                        <td>2</td>
                        <td>Cerrado</td>
                        <td>2024-04-16</td>
                        <td>11:00:56</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </footer>
</body>
</html>
