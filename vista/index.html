<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="vista.css">
</head>
<body>
    <div class="button-container">
        <a href="vista.html" class="button">Inicio</a>
        <a href="tiempo.html" class="button">Tiempo</a>
        <a href="registros.html" class="button">Registros</a>
    </div>
    
    <div class="dashboard">
        <h2>Dispensador</h2>
        <div class="images-container">
            <div style="position: relative; display: inline-block;">
                <img src="../imagen/agua.png" alt="Water Image">
                <div style="position: absolute; top: 0; left: 0; width: 100%; text-align: center;">Agua</div>
                <input class="form-check-input" type="checkbox" id="dispense_water_1">
                <label class="form-check-label" for="dispense_water_1">Agua</label>
            </div>
            <div class="images-container">
                <div style="position: relative; display: inline-block;">
                    <img src="../imagen/comida.png" alt="Water Image">
                    <div style="position: absolute; top: 0; left: 0; width: 100%; text-align: center;">Comida</div>
                    <input class="form-check-input" type="checkbox" id="dispense_food_1">
                    <label class="form-check-label" for="dispense_food_1">Comida</label>
                </div>
        </div>
    </div>


</body>
<script src="https://www.gstatic.com/firebasejs/6.2.0/firebase-app.js"></script>
<script  src="https://www.gstatic.com/firebasejs/3.1.0/firebase-database.js"></script>
<script  src="./conexion.js"></script>



</html>
